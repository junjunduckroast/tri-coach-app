<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tri Coach">
<meta name="theme-color" content="#0b0f14">
<title>Tri Coach</title>
<style>
:root{--bg:#0b0f14;--card:#141b24;--card2:#1b2530;--tx:#e8eef5;--mu:#8a98a8;--ac:#35e0a1;--bl:#4aa3ff;--or:#ffb84a;--re:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(92px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;margin:4px 0 2px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 10px;font-weight:600}
h3{font-size:16px;margin:0 0 4px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0}
.muted{color:var(--mu)}.small{font-size:13px}.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.grow{flex:1}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--mu)}
.big{font-size:34px;font-weight:700;line-height:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:600;background:var(--card2);color:var(--tx);min-height:46px}
.btn.pri{background:var(--ac);color:#06201a}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.btn.red{background:#3a1d1f;color:var(--re)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input,select{width:100%;background:var(--card2);border:1px solid #263241;border-radius:12px;color:var(--tx);padding:12px;font-size:16px}
label.f{display:block;font-size:12px;color:var(--mu);margin:8px 0 4px}
.bar{margin:10px 0}.bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bt{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}.bt i{display:block;height:100%;border-radius:99px}
.xp{height:12px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--bl));border-radius:99px}
.spark{width:100%;height:64px}.spark .ln{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark .dot{fill:var(--ac)}.spark .goal{stroke:var(--or);stroke-dasharray:4 4;stroke-width:1.5}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(20,27,36,.96);backdrop-filter:blur(12px);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid #222d3a}
.nav button{background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;flex:1}
.nav button b{font-size:21px;font-weight:400}.nav button.on{color:var(--ac)}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #1f2a37}.li:first-child{border-top:0}
.ic{font-size:22px;width:30px;text-align:center}
.seg{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--card2)}
.seg i{display:block;height:100%}
.ok{color:var(--ac)}.warn{color:var(--or)}.bad{color:var(--re)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.pre{white-space:pre-wrap}
.cb{width:26px;height:26px;border-radius:8px;border:2px solid #34455a;display:flex;align-items:center;justify-content:center;flex:none}
.cb.on{background:var(--ac);border-color:var(--ac);color:#06201a}
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var CONFIG = { url: 'https://epdgpxnjwnuaugwhbgvc.supabase.co', key: 'sb_publishable_W70PYM9dEzkiynnte3BDyQ_Q-Jpj3V7' };
var RACE = '2027-11-01';
var PLAN_START = '2026-11-02';
var sb = supabase.createClient(CONFIG.url, CONFIG.key);
var S = { tab: 'today', user: null, d: {}, x: {}, targets: { kcal: 2300, protein: 160, water: 3000, goalKg: 80 }, done: {}, sync: null, pending: null, busy: false, note: '' };

/* icon for the home screen */
(function () {
  var c = document.createElement('canvas'); c.width = 180; c.height = 180;
  var g = c.getContext('2d'); var gr = g.createLinearGradient(0, 0, 180, 180);
  gr.addColorStop(0, '#35e0a1'); gr.addColorStop(1, '#4aa3ff');
  g.fillStyle = gr; g.fillRect(0, 0, 180, 180); g.fillStyle = '#0b0f14';
  g.font = 'bold 84px -apple-system,Helvetica,Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('TC', 90, 96);
  var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
  document.head.appendChild(l);
})();

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function dayDiff(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
function localDay(ts) { return iso(new Date(ts)); }
function esc(s) { return String(s == null ? '' : s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;'); }
function sum(a, k) { var t = 0; a.forEach(function (r) { t += +r[k] || 0; }); return t; }
function toast(m) { var t = $('toast'); t.textContent = m; t.className = 'show'; setTimeout(function () { t.className = ''; }, 2400); }
function fmtMin(m) { m = Math.round(m); return m >= 60 ? Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm' : m + 'm'; }
function sportOf(t) {
  t = (t || '').toLowerCase();
  if (t.indexOf('swim') >= 0) return 'swim';
  if (t.indexOf('run') >= 0) return 'run';
  if (t.indexOf('cycl') >= 0 || t.indexOf('bik') >= 0 || t.indexOf('ride') >= 0) return 'bike';
  if (t.indexOf('multi') >= 0 || t.indexOf('triathlon') >= 0) return 'multi';
  return 'other';
}
var ICON = { swim: '🏊', bike: '🚴', run: '🏃', multi: '🏁', other: '💪', rest: '😴', race: '🏁', test: '⏱️' };
function card(t, b, c) { return '<section class="card ' + (c || '') + '">' + (t ? '<h2>' + t + '</h2>' : '') + b + '</section>'; }
function bar(l, v, m, u, c) {
  var p = m > 0 ? Math.min(100, Math.round(100 * v / m)) : 0;
  return '<div class="bar"><div class="bl"><span>' + l + '</span><span>' + Math.round(v) + ' / ' + Math.round(m) + u + '</span></div><div class="bt"><i style="width:' + p + '%;background:' + (c || 'var(--ac)') + '"></i></div></div>';
}
function spark(vals, line) {
  var w = 300, h = 64, pts = [];
  vals.forEach(function (v, i) { if (v != null && !isNaN(v)) pts.push([i, +v]); });
  if (pts.length < 2) return '<div class="muted small">Not enough data yet</div>';
  var ys = pts.map(function (p) { return p[1]; });
  var mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys);
  if (line != null) { mn = Math.min(mn, line); mx = Math.max(mx, line); }
  if (mx === mn) mx = mn + 1;
  var n = vals.length - 1 || 1;
  function X(i) { return 4 + (w - 8) * i / n; }
  function Y(v) { return h - 4 - (h - 8) * (v - mn) / (mx - mn); }
  var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); }).join(' ');
  var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="spark">';
  if (line != null) s += '<line x1="4" x2="' + (w - 4) + '" y1="' + Y(line).toFixed(1) + '" y2="' + Y(line).toFixed(1) + '" class="goal"/>';
  s += '<path d="' + d + '" class="ln"/>';
  var last = pts[pts.length - 1];
  return s + '<circle cx="' + X(last[0]).toFixed(1) + '" cy="' + Y(last[1]).toFixed(1) + '" r="3.5" class="dot"/></svg>';
}

/* ---------- training plan generator (Nov 2026 to race day) ---------- */
var PHASES = [
  { name: 'Reset', from: 0, to: 2, swim: [1500, 1800], bi: [45, 50], lr: [90, 100], lrun: [50, 60], rq: [30, 35], br: [0, 0], tip: 'Easy rebuild. Nothing hard.' },
  { name: 'Base', from: 3, to: 16, swim: [2200, 3000], bi: [60, 75], lr: [120, 210], lrun: [70, 100], rq: [40, 50], br: [0, 10], tip: 'Zone 2 and technique. Keep it conversational.' },
  { name: 'Capacity', from: 17, to: 29, swim: [2800, 3500], bi: [75, 90], lr: [210, 360], lrun: [100, 125], rq: [50, 60], br: [15, 20], tip: 'Long and steady. Practise race fuelling.' },
  { name: 'Build', from: 30, to: 41, swim: [3000, 3500], bi: [80, 90], lr: [300, 330], lrun: [110, 120], rq: [55, 65], br: [20, 25], tip: 'Race-pace efforts inside the long sessions.' },
  { name: 'Peak', from: 42, to: 48, swim: [3000, 3200], bi: [75, 80], lr: [270, 240], lrun: [100, 90], rq: [50, 55], br: [20, 20], tip: 'Race simulation. Rehearse kit and nutrition.' },
  { name: 'Taper', from: 49, to: 51, swim: [3000, 3000], bi: [75, 75], lr: [210, 210], lrun: [90, 90], rq: [50, 50], br: [15, 15], tip: 'Keep sharp, cut volume. Sleep a lot.' }
];
function lerp(a, b, p) { return a + (b - a) * p; }
function r5(x) { return Math.max(0, Math.round(x / 5) * 5); }
function planFor(ds) {
  var w = Math.floor(dayDiff(PLAN_START, ds) / 7);
  if (w < 0) return null;
  if (ds >= RACE) return { phase: 'Race', sport: 'race', title: ds === RACE ? 'RACE DAY' : 'Recover', details: ds === RACE ? 'Ironman 70.3 Goa. Trust the work.' : 'Walk, eat, sleep.', min: 0 };
  var ph = null; PHASES.forEach(function (p) { if (w >= p.from && w <= p.to) ph = p; });
  if (!ph) return null;
  var wip = w - ph.from, len = ph.to - ph.from + 1, p = len > 1 ? wip / (len - 1) : 0;
  var rec = (ph.name !== 'Taper' && ph.name !== 'Reset' && wip % 4 === 3);
  var f = rec ? 0.7 : 1;
  if (ph.name === 'Taper') f = [0.7, 0.5, 0.35][wip];
  if (ph.name === 'Reset') f = [0.6, 0.75, 0.85][wip];
  var dow = (parse(ds).getDay() + 6) % 7;
  var mon = parse(ds).getMonth();
  var indoor = (mon >= 5 && mon <= 8) ? ' Indoor trainer if it is raining.' : '';
  var swimM = r5(lerp(ph.swim[0], ph.swim[1], p) * f / 5) * 5;
  var bi = r5(lerp(ph.bi[0], ph.bi[1], p) * f);
  var lr = r5(lerp(ph.lr[0], ph.lr[1], p) * f);
  var lrun = r5(lerp(ph.lrun[0], ph.lrun[1], p) * f);
  var rq = r5(lerp(ph.rq[0], ph.rq[1], p) * f);
  var br = r5(lerp(ph.br[0], ph.br[1], p) * f);
  var base = { phase: ph.name, rec: rec, tip: ph.tip };
  function mk(sport, title, details, min) { var o = { sport: sport, title: title, details: details, min: min }; for (var k in base) o[k] = base[k]; return o; }
  if (w === 1) {
    if (dow === 1) return mk('test', 'Swim test day', 'Warm up 400 m. Then 400 m time trial, rest 5 min, 200 m time trial. Write both times down.', 60);
    if (dow === 3) return mk('test', 'Run test: 5 km time trial', 'Warm up 15 min easy. Run 5 km flat as fast as you can hold. Cool down 10 min.', 55);
    if (dow === 5) return mk('test', 'Bike test: 20 minutes', 'Warm up 20 min. Ride 20 min as hard as you can hold steady. Cool down 10 min.', 60);
  }
  if (dow === 0) return mk('swim', 'Swim technique + strength', swimM + ' m: drills, pull, easy swim. Then 30 min strength (legs, core, shoulders).', r5(swimM / 38) + 30);
  if (dow === 1) return mk('bike', 'Bike intervals', 'Warm up 15 min, then ' + (ph.name === 'Build' || ph.name === 'Peak' ? '3 x 12 min at race power' : ph.name === 'Capacity' ? '4 x 8 min tempo' : '5 x 4 min steady') + ', cool down 10 min.' + indoor, bi);
  if (dow === 2) return mk('swim', 'Swim threshold + easy run', swimM + ' m with main set at threshold pace. Then 30 to 40 min easy run, Zone 2.', r5(swimM / 38) + 35);
  if (dow === 3) return mk('run', 'Run quality', ph.name === 'Base' || ph.name === 'Reset' ? 'Easy run with 6 x 20 s strides.' : ph.name === 'Capacity' ? 'Tempo: 20 to 30 min at comfortably hard pace.' : 'Intervals or race-pace tempo, 20 to 30 min of work.', rq);
  if (dow === 4) return mk('rest', 'Rest day', 'Full rest. Mobility, walk, eat well, sleep early.', 0);
  if (dow === 5) {
    if (ph.name === 'Peak' && !rec && wip % 2 === 1) return mk('multi', 'Race simulation', '90 km at target race power, then 10 km run at race pace. Race-day nutrition only.' + indoor, 240);
    return mk('bike', 'Long ride' + (br ? ' + brick' : ''), 'Steady Zone 2 ride, fuel 60 to 90 g carbs per hour.' + (br ? ' Then ' + br + ' min run off the bike.' : '') + indoor, lr + br);
  }
  return mk('run', 'Long run' + (ph.name === 'Base' || ph.name === 'Capacity' ? ' + sea swim' : ''), 'Easy long run, Zone 2. Practise fuelling.' + (ph.name === 'Base' || ph.name === 'Capacity' ? ' Add a 20 to 30 min open-water swim if safe.' : ''), lrun);
}
function planOf(ds) {
  var o = S.x.over && S.x.over[ds];
  var g = planFor(ds);
  if (o) return { phase: g ? g.phase : '', sport: o.sport || 'other', title: o.title || 'Session', details: o.details || '', min: o.planned_minutes || 0, tip: g ? g.tip : '' };
  return g;
}

/* ---------- data ---------- */
async function load() {
  var since = iso(addDays(new Date(), -120));
  var sinceTs = parse(since).toISOString();
  var res = await Promise.all([
    sb.from('daily_metrics').select('*').gte('day', since).order('day'),
    sb.from('activities').select('id,sport,name,start_time,duration_s,distance_m,avg_hr,calories').gte('start_time', sinceTs).order('start_time', { ascending: false }),
    sb.from('weight_log').select('*').gte('logged_at', sinceTs).order('logged_at'),
    sb.from('food_log').select('*').gte('logged_at', sinceTs).order('logged_at'),
    sb.from('hydration_log').select('*').gte('logged_at', sinceTs).order('logged_at'),
    sb.from('coach_notes').select('*').order('created_at', { ascending: false }).limit(10),
    sb.from('settings').select('*').in('key', ['targets', 'milestones_done', 'sync_status']),
    sb.from('plan_sessions').select('*').gte('day', since)
  ]);
  var names = ['metrics', 'acts', 'weights', 'foods', 'water', 'notes', 'settings', 'over'];
  names.forEach(function (n, i) { if (res[i].error) console.log(n, res[i].error.message); S.d[n] = res[i].data || []; });
  S.d.settings.forEach(function (r) {
    if (r.key === 'targets' && r.value) Object.assign(S.targets, r.value);
    if (r.key === 'milestones_done') S.done = r.value || {};
    if (r.key === 'sync_status') S.sync = r.value;
  });
  var x = { acts: {}, food: {}, water: {}, weight: {}, met: {}, over: {} };
  S.d.acts.forEach(function (a) { var d = localDay(a.start_time); (x.acts[d] = x.acts[d] || []).push(a); });
  S.d.foods.forEach(function (a) { var d = localDay(a.logged_at); (x.food[d] = x.food[d] || []).push(a); });
  S.d.water.forEach(function (a) { var d = localDay(a.logged_at); x.water[d] = (x.water[d] || 0) + (+a.ml || 0); });
  S.d.weights.forEach(function (a) { x.weight[localDay(a.logged_at)] = +a.kg; });
  S.d.metrics.forEach(function (m) { x.met[m.day] = m; });
  S.d.over.forEach(function (o) { x.over[o.day] = o; });
  S.x = x;
}
function minutesOn(ds) { var t = 0; (S.x.acts[ds] || []).forEach(function (a) { t += (a.duration_s || 0) / 60; }); return t; }
function computeXP() {
  var xp = 0, x = S.x;
  S.d.acts.forEach(function (a) { xp += 20 + Math.floor((a.duration_s || 0) / 360); });
  Object.keys(x.water).forEach(function (d) { if (x.water[d] >= S.targets.water) xp += 10; });
  Object.keys(x.food).forEach(function (d) { if (x.food[d].length >= 2) xp += 10; });
  Object.keys(x.weight).forEach(function () { xp += 5; });
  S.d.metrics.forEach(function (m) { if ((m.sleep_seconds || 0) >= 25200) xp += 15; });
  return xp;
}
function levelInfo(xp) {
  var l = 1 + Math.floor(Math.sqrt(xp / 40)), lo = 40 * (l - 1) * (l - 1), hi = 40 * l * l;
  return { lvl: l, pct: Math.round(100 * (xp - lo) / (hi - lo)), xp: xp, next: hi };
}
function streak() {
  var x = S.x, d = new Date(), n = 0;
  function act(ds) { return (x.acts[ds] && x.acts[ds].length) || (x.food[ds] && x.food[ds].length) || x.weight[ds]; }
  if (!act(iso(d))) d = addDays(d, -1);
  while (act(iso(d))) { n++; d = addDays(d, -1); }
  return n;
}
function readiness() {
  var ms = S.d.metrics, m = null;
  for (var i = ms.length - 1; i >= 0; i--) { if (ms[i].sleep_score != null || ms[i].body_battery_high != null) { m = ms[i]; break; } }
  if (!m) return null;
  var parts = [], wts = [];
  if (m.sleep_score != null) { parts.push(m.sleep_score); wts.push(0.4); }
  if (m.body_battery_high != null) { parts.push(m.body_battery_high); wts.push(0.35); }
  if (m.avg_stress != null) { parts.push(100 - m.avg_stress); wts.push(0.25); }
  var tw = 0, tv = 0; parts.forEach(function (v, i) { tv += v * wts[i]; tw += wts[i]; });
  var sc = Math.round(tv / tw);
  var msg = sc >= 75 ? 'Green. Train as planned.' : sc >= 55 ? 'Amber. Keep intensity controlled.' : 'Red. Go easy or rest.';
  var cls = sc >= 75 ? 'ok' : sc >= 55 ? 'warn' : 'bad';
  return { sc: sc, msg: msg, cls: cls, m: m };
}
function weekDays() { var d = new Date(), dow = (d.getDay() + 6) % 7, m = addDays(d, -dow), a = []; for (var i = 0; i < 7; i++) a.push(iso(addDays(m, i))); return a; }
function quests() {
  var wd = weekDays(), x = S.x, swims = 0, wdays = 0, fdays = 0, sdays = 0, mins = 0, planned = 0;
  wd.forEach(function (d) {
    (x.acts[d] || []).forEach(function (a) { if (sportOf(a.sport) === 'swim') swims++; mins += (a.duration_s || 0) / 60; });
    if ((x.water[d] || 0) >= S.targets.water) wdays++;
    if ((x.food[d] || []).length) fdays++;
    var m = x.met[d]; if (m && (m.sleep_seconds || 0) >= 25200) sdays++;
    var p = planOf(d); if (p) planned += p.min || 0;
  });
  return [
    { t: 'Swim 3 times', v: swims, m: 3, u: '' },
    { t: 'Hit your water target 5 days', v: wdays, m: 5, u: '' },
    { t: 'Log food on 6 days', v: fdays, m: 6, u: '' },
    { t: 'Sleep 7h or more on 5 nights', v: sdays, m: 5, u: '' },
    { t: 'Finish the week plan', v: Math.round(mins), m: Math.max(60, planned), u: ' min' }
  ];
}

/* ---------- views ---------- */
function vToday() {
  var today = iso(new Date()), x = S.x, plan = planOf(today);
  var left = dayDiff(today, RACE);
  var li = levelInfo(computeXP()), st = streak(), rd = readiness();
  var foods = x.food[today] || [], kcal = sum(foods, 'kcal'), prot = sum(foods, 'protein_g');
  var kT = S.targets.kcal + Math.round(8 * minutesOn(today));
  var wat = x.water[today] || 0, wT = S.targets.water + Math.round(10 * minutesOn(today));
  var h = '<div class="row between"><div><h1>Today</h1><div class="muted small">' + parse(today).toDateString() + '</div></div><div class="center"><div class="big">' + (left > 0 ? left : 0) + '</div><div class="muted small">days to Goa</div></div></div>';
  h += card('', '<div class="row between"><div><div class="muted small">LEVEL</div><div class="big">' + li.lvl + '</div></div><div class="grow" style="padding:0 6px"><div class="xp"><i style="width:' + li.pct + '%"></i></div><div class="muted small" style="margin-top:6px">' + li.xp + ' XP, next level at ' + li.next + '</div></div><div class="center"><div class="big">' + st + '</div><div class="muted small">day streak</div></div></div>');

function vTrain() {

function series(key, n, f) {
  var a = []; for (var i = n - 1; i >= 0; i--) { var m = S.x.met[iso(addDays(new Date(), -i))]; var v = m ? m[key] : null; a.push(v == null ? null : (f ? f(v) : v)); }
  return a;
}
function avg(a) { var v = a.filter(function (z) { return z != null; }); return v.length ? v.reduce(function (s, z) { return s + z; }, 0) / v.length : null; }

  var rh = series('resting_hr', 30), ra = avg(rh);
  h += card('Resting heart rate &middot; avg ' + (ra == null ? '-' : Math.round(ra)), spark(rh) + '<div class="muted small">Rising for several days means you may be tired or ill.</div>');

/* ---------- actions ---------- */
async function refresh() { await load(); render(); }
async function ins(table, row) { var r = await sb.from(table).insert(row); if (r.error) { toast('Error: ' + r.error.message); return false; } return true; }
function resize(file, max) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function onPhoto(file) {

    var img = await resize(file, 1024);
    var sess = (await sb.auth.getSession()).data.session;
    var r = await fetch(CONFIG.url + '/functions/v1/food-estimate', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sess.access_token, 'apikey': CONFIG.key }, body: JSON.stringify({ image: img.split(',')[1], note: S.note }) });

}
async function saveFood() {

document.addEventListener('change', function (e) { if (e.target && e.target.id === 'cam' && e.target.files[0]) onPhoto(e.target.files[0]); });

  var t = e.target.closest('[data-act]'); if (!t) return;
